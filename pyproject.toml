[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixagent"
version = "0.1.0"
description = "Agente de IA avanzado integrado con PixPin: planos con fotos, diagramas, informes PDF, mini apps y Python."
readme = "README.md"
requires-python = ">=3.10"
# Núcleo mínimo: todo en Python puro o con ruedas para Windows, macOS, Linux y Android (Termux).
dependencies = [
  "anthropic>=2.6.0", "pillow>=10.1", "reportlab>=4.0", "pypdf>=4.0",
  "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Recomendado en PC/Mac: páginas de PDF como imagen, PDF como plano base, gráficos, fotos HEIC, QR
full = ["pymupdf>=1.24", "matplotlib>=3.8", "pillow-heif>=0.16", "qrcode>=7.4"]
browser = ["playwright>=1.45"]
# IA local: transcripción (Whisper), vídeo por URL y ffmpeg portátil
local = ["faster-whisper>=1.1", "yt-dlp>=2025.1", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pixagent = "pixagent.__main__:main"

[tool.setuptools.packages.find]
include = ["pixagent*"]

[tool.setuptools.package-data]
"pixagent.web" = ["static/*"]
"pixagent.reports" = ["templates/*.json"]
"pixagent.miniapps" = ["**/*"]
